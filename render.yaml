# Blueprint Render : un service web (NestJS + Angular embarqué) et une base PostgreSQL.
# Déploiement continu : Render redéploie automatiquement dès que les vérifications GitHub
# (workflow CI) sont au vert sur la branche main.
services:
  - type: web
    name: club-foot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: club-foot-db
          property: connectionString
      # Clé demandée par la page « Inscrits » : générée par Render, visible dans
      # le tableau de bord du service (Environment).
      - key: ADMIN_KEY
        generateValue: true

databases:
  - name: club-foot-db
    plan: free
    databaseName: clubfoot
    user: clubfoot
