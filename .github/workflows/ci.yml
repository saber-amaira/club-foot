name: CI

on:
  push:
  pull_request:

# Annule les exécutions devenues obsolètes sur la même branche
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Le déploiement n'est pas ici : Render redéploie tout seul quand ces vérifications
# sont au vert sur la branche main (autoDeployTrigger: checksPass dans render.yaml).
jobs:
  backend:
    name: Backend NestJS (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clubfoot
          POSTGRES_USER: clubfoot
          POSTGRES_PASSWORD: clubfoot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clubfoot -d clubfoot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://clubfoot:clubfoot@localhost:5432/clubfoot
      ADMIN_KEY: cle-de-test
    steps:
      - uses: actions/checkout@v5

      - name: Installer Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          # Ajouter « cache: npm » une fois backend/package-lock.json commité

      - name: Installer les dépendances
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Compiler
        run: npm run build

      - name: Tests (unitaires + API sur PostgreSQL)
        run: npm test

  frontend:
    name: Frontend Angular (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Installer Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          # Ajouter « cache: npm » une fois frontend/package-lock.json commité

      - name: Installer les dépendances
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Tests
        run: npm test -- --no-watch

      - name: Build de production
        run: npm run build

  docker:
    name: Image Docker (identique à Render)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image
        run: docker build -t club-foot:ci .
