databaseChangeLog:
  - changeSet:
      id: 001-create-inscription
      author: club-foot
      changes:
        - createTable:
            tableName: inscription
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_inscription
                    nullable: false
              - column:
                  name: prenom
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: nom
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: date_naissance
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: email_parent
                  type: varchar(254)
                  constraints:
                    nullable: false
              - column:
                  name: telephone_parent
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: inscription
            columnNames: prenom, nom, date_naissance, email_parent
            constraintName: uk_inscription_enfant
