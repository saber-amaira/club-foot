spring:
  application:
    name: club-foot
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clubfoot}
    username: ${DB_USER:clubfoot}
    password: ${DB_PASSWORD:clubfoot}
  jpa:
    open-in-view: false
    hibernate:
      # Le schéma est géré uniquement par Liquibase
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  # Render injecte PORT
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
